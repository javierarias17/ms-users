# CD de ms-users
#
# Pasos: Update ECS service -> Notificar en caso de fallo
#
# Se dispara automáticamente cuando termina con éxito el pipeline de CI
# (azure-pipelines-ci.yml) sobre la rama main.
#
# El paso de notificación no depende de ningún webhook externo: se apoya
# en las notificaciones nativas de Azure DevOps (Project Settings ->
# Notifications -> "Build fails" -> agrega tu email como destinatario).
# Ese step solo deja el detalle del fallo en el log del pipeline.
#
# Requiere:
# - Variable group 'aws-ecr-credentials' (igual que el CI).
# - Que en Azure DevOps exista un pipeline llamado 'ms-users-ci' apuntando
#   a azure-pipelines-ci.yml (el nombre debe coincidir con "source" abajo).

resources:
  pipelines:
    - pipeline: ciPipeline
      source: ms-users-ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: aws-ecr-credentials

steps:

  - download: ciPipeline
    artifact: image-uri
    displayName: 'Descargar artefacto de imagen generado por el CI'

  - script: |
      IMAGE_URI=$(cat $(PIPELINE.WORKSPACE)/ciPipeline/image-uri/image-uri.txt)
      echo "##vso[task.setvariable variable=imageUri]$IMAGE_URI"
      echo "Imagen a desplegar: $IMAGE_URI"
    displayName: 'Leer imagen a desplegar'

  # 1. Update ECS service
  #    Registra una nueva revisión de la Task Definition con la imagen nueva,
  #    y actualiza el Service para que la use.
  - script: |
      aws ecs describe-task-definition \
        --task-definition task-ms-users \
        --region $(AWS_DEFAULT_REGION) \
        --query 'taskDefinition' > task-def.json

      jq --arg IMAGE "$(imageUri)" '
        (.containerDefinitions[] | select(.name == "ms-users") .image) = $IMAGE |
        del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
      ' task-def.json > new-task-def.json

      NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
        --cli-input-json file://new-task-def.json \
        --region $(AWS_DEFAULT_REGION) \
        --query 'taskDefinition.taskDefinitionArn' \
        --output text)

      echo "Nueva Task Definition: $NEW_TASK_DEF_ARN"

      aws ecs update-service \
        --cluster cluster-ms-users \
        --service svc-ms-users \
        --task-definition "$NEW_TASK_DEF_ARN" \
        --region $(AWS_DEFAULT_REGION) \
        --force-new-deployment
    displayName: 'Update ECS service'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  # 2. Notificar en caso de fallo (Azure DevOps envía el email nativo
  #    configurado en Project Settings -> Notifications; este step solo
  #    deja el detalle en el log para quien revise el pipeline)
  - script: |
      echo "##vso[task.logissue type=error]Falló el despliegue de ms-users (Build $(Build.BuildNumber)). Revisa el paso 'Update ECS service'."
    displayName: 'Registrar fallo de despliegue'
    condition: failed()
