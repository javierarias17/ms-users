# CD de ms-users
#
# Pasos: Update ECS service -> Send google message in case of failure
#
# Se dispara automáticamente cuando termina con éxito el pipeline de CI
# (azure-pipelines-ci.yml) sobre la rama main.
#
# Requiere:
# - Variable group 'aws-ecr-credentials' (igual que el CI).
# - Variable group 'notifications' con GOOGLE_CHAT_WEBHOOK_URL (secreto):
#   la URL de un Incoming Webhook de un space de Google Chat
#   (Space -> Apps & integrations -> Webhooks).
# - Que en Azure DevOps exista un pipeline llamado 'ms-users-ci' apuntando
#   a azure-pipelines-ci.yml (el nombre debe coincidir con "source" abajo).

resources:
  pipelines:
    - pipeline: ciPipeline
      source: ms-users-ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: aws-ecr-credentials
  - group: notifications

steps:

  - download: ciPipeline
    artifact: image-uri
    displayName: 'Descargar artefacto de imagen generado por el CI'

  - script: |
      IMAGE_URI=$(cat $(PIPELINE.WORKSPACE)/ciPipeline/image-uri/image-uri.txt)
      echo "##vso[task.setvariable variable=imageUri]$IMAGE_URI"
      echo "Imagen a desplegar: $IMAGE_URI"
    displayName: 'Leer imagen a desplegar'

  # 1. Update ECS service
  #    Registra una nueva revisión de la Task Definition con la imagen nueva,
  #    y actualiza el Service para que la use.
  - script: |
      aws ecs describe-task-definition \
        --task-definition task-ms-users \
        --region $(AWS_DEFAULT_REGION) \
        --query 'taskDefinition' > task-def.json

      jq --arg IMAGE "$(imageUri)" '
        (.containerDefinitions[] | select(.name == "ms-users") .image) = $IMAGE |
        del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
      ' task-def.json > new-task-def.json

      NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
        --cli-input-json file://new-task-def.json \
        --region $(AWS_DEFAULT_REGION) \
        --query 'taskDefinition.taskDefinitionArn' \
        --output text)

      echo "Nueva Task Definition: $NEW_TASK_DEF_ARN"

      aws ecs update-service \
        --cluster cluster-ms-users \
        --service svc-ms-users \
        --task-definition "$NEW_TASK_DEF_ARN" \
        --region $(AWS_DEFAULT_REGION) \
        --force-new-deployment
    displayName: 'Update ECS service'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  # 2. Send google message in case of failure
  - script: |
      curl -sf -X POST "$(GOOGLE_CHAT_WEBHOOK_URL)" \
        -H 'Content-Type: application/json' \
        -d "{\"text\": \"Falló el despliegue de ms-users. Build: $(Build.BuildNumber). Ver: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)\"}"
    displayName: 'Notificar fallo en Google Chat'
    condition: failed()
