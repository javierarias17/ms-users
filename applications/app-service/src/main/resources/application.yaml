server:
  port: ${SERVER_PORT}
spring:
  application:
    name: "msUsers"
  devtools:
    add-properties: false
  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
